name: Check out the composed libraries
description: >
  Checks out the libraries dasmig-gen is built from, at the release tags it was tested with, under libs/. Move the tags here, in one place, when adopting a newer release; the known-output tests change with them.

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with: {repository: dasmig/address-generator, ref: v2.1.1, path: libs/address-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/biodata-generator, ref: v5.0.1, path: libs/biodata-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/birth-generator, ref: v3.2.1, path: libs/birth-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/city-generator, ref: v4.2.1, path: libs/city-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/country-generator, ref: v3.2.1, path: libs/country-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/device-generator, ref: v1.0.3, path: libs/device-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/email-generator, ref: v2.1.2, path: libs/email-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/entity-generator, ref: v4.2.2, path: libs/entity-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/interest-generator, ref: v3.0.2, path: libs/interest-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/name-generator, ref: v4.5.1, path: libs/name-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/nickname-generator, ref: v5.2.1, path: libs/nickname-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/occupation-generator, ref: v3.0.2, path: libs/occupation-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/persona-generator, ref: v4.1.2, path: libs/persona-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/phone-generator, ref: v2.1.2, path: libs/phone-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/relationship-generator, ref: v1.2.1, path: libs/relationship-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/trait-generator, ref: v2.1.3, path: libs/trait-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/user-generator, ref: v2.1.1, path: libs/user-generator}
    - uses: actions/checkout@v4
      with: {repository: dasmig/weather-generator, ref: v2.0.0, path: libs/weather-generator}
